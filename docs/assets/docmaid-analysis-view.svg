  <text x="152" y="632" fill="#112132" font-family="Arial, sans-serif" font-size="30" font-weight="700">审计问题列表</text>
  <rect x="152" y="674" width="392" height="188" rx="22" fill="#FFFFFF" stroke="#E0E8EC"/>
  <text x="176" y="716" fill="#112132" font-family="Arial, sans-serif" font-size="20" font-weight="700">问题 1：标题跳级</text>
  <text x="176" y="752" fill="#5F7280" font-family="Arial, sans-serif" font-size="16">H1 后直接出现 H3，会让目录结构断层。</text>
  <text x="176" y="786" fill="#0F766E" font-family="Arial, sans-serif" font-size="16">建议：将“项目背景”提升为 H2。</text>
  <rect x="176" y="810" width="86" height="30" rx="10" fill="#FFF5E7"/>
  <text x="219" y="830" text-anchor="middle" fill="#A56500" font-family="Arial, sans-serif" font-size="14" font-weight="700">high</text>
  <rect x="584" y="674" width="392" height="188" rx="22" fill="#FFFFFF" stroke="#E0E8EC"/>
  <text x="608" y="716" fill="#112132" font-family="Arial, sans-serif" font-size="20" font-weight="700">问题 2：标题语义太弱</text>
  <text x="608" y="752" fill="#5F7280" font-family="Arial, sans-serif" font-size="16">“其他”“说明”这类标题无法体现内容主题。</text>
  <text x="608" y="786" fill="#0F766E" font-family="Arial, sans-serif" font-size="16">建议：改成“部署说明”“风险与限制”。</text>
  <rect x="608" y="810" width="104" height="30" rx="10" fill="#EEF7F8"/>
  <text x="660" y="830" text-anchor="middle" fill="#0F766E" font-family="Arial, sans-serif" font-size="14" font-weight="700">medium</text>
  <rect x="1016" y="674" width="432" height="188" rx="22" fill="#FFFFFF" stroke="#E0E8EC"/>
  <text x="1040" y="716" fill="#112132" font-family="Arial, sans-serif" font-size="20" font-weight="700">问题 3：单节过长</text>
  <text x="1040" y="752" fill="#5F7280" font-family="Arial, sans-serif" font-size="16">一个小节承载过多内容，读者难以快速定位。</text>
  <text x="1040" y="786" fill="#0F766E" font-family="Arial, sans-serif" font-size="16">建议：按主题拆成“背景 / 方案 / 风险”。</text>
  <rect x="1040" y="810" width="104" height="30" rx="10" fill="#EEF7F8"/>
  <text x="1092" y="830" text-anchor="middle" fill="#0F766E" font-family="Arial, sans-serif" font-size="14" font-weight="700">medium</text>
  <path d="M552 398H584" stroke="#0F766E" stroke-width="5" stroke-linecap="round"/>
  <path d="M1016 398H1048" stroke="#0F766E" stroke-width="5" stroke-linecap="round"/>
  <text x="108" y="994" fill="#73838F" font-family="Arial, sans-serif" font-size="20">图示：DocMaid 会把原始目录、建议蓝图、问题审计和一致性结果放在同一个视图中，便于快速比对</text>
</svg>
