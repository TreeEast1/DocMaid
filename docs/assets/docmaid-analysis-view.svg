  <text x="176" y="408" fill="#5F7280" font-family="Arial, sans-serif" font-size="18">H2 工作内容</text>
  <text x="176" y="444" fill="#5F7280" font-family="Arial, sans-serif" font-size="18">H4 技术细节</text>
