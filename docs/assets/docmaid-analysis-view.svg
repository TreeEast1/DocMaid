  <text x="172" y="497" fill="#A56500" font-family="Arial, sans-serif" font-size="15" font-weight="700">存在跳级标题</text>
  <rect x="584" y="246" width="432" height="304" rx="24" fill="#FBFCFD" stroke="#E0E8EC"/>
  <text x="616" y="290" fill="#112132" font-family="Arial, sans-serif" font-size="28" font-weight="700">建议蓝图</text>
  <text x="616" y="336" fill="#0F766E" font-family="Arial, sans-serif" font-size="18">H1 实习项目总结</text>
  <text x="640" y="372" fill="#0F766E" font-family="Arial, sans-serif" font-size="18">H2 项目背景与目标</text>
  <text x="640" y="408" fill="#0F766E" font-family="Arial, sans-serif" font-size="18">H2 工作内容</text>
  <text x="664" y="444" fill="#0F766E" font-family="Arial, sans-serif" font-size="18">H3 关键技术细节</text>
  <rect x="616" y="474" width="210" height="34" rx="12" fill="#E8F5F4"/>
  <text x="636" y="497" fill="#0F766E" font-family="Arial, sans-serif" font-size="15" font-weight="700">最小改动，层级更顺</text>
  <rect x="1048" y="246" width="432" height="304" rx="24" fill="#FBFCFD" stroke="#E0E8EC"/>
  <text x="1080" y="290" fill="#112132" font-family="Arial, sans-serif" font-size="28" font-weight="700">一致性检查</text>
  <rect x="1080" y="330" width="160" height="40" rx="14" fill="#E8F5F4"/>
  <text x="1160" y="356" text-anchor="middle" fill="#0F766E" font-family="Arial, sans-serif" font-size="16" font-weight="700">verdict: pass</text>
  <text x="1080" y="410" fill="#5F7280" font-family="Arial, sans-serif" font-size="18">保留术语：API、Prompt、LaTeX</text>
  <text x="1080" y="446" fill="#5F7280" font-family="Arial, sans-serif" font-size="18">代码块数量：2 → 2</text>
  <text x="1080" y="482" fill="#5F7280" font-family="Arial, sans-serif" font-size="18">公式块数量：1 → 1</text>
